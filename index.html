
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050816">
<title>LUAN ALBUM VIP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050816;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{text-align:center;padding:35px 15px}
h1{
font-size:clamp(28px,7vw,45px);
background:linear-gradient(90deg,#00eaff,#a855f7,#ff00a8,#00eaff);
background-size:300%;
color:transparent;background-clip:text;
animation:rgb 5s linear infinite
}
@keyframes rgb{to{background-position:300%}}
header p{color:#9caecb;margin-top:10px}
main{max-width:1100px;margin:auto;padding:15px}
.panel{background:#101a30;border:1px solid #245078;border-radius:18px;padding:18px;margin-bottom:18px}
.controls{display:flex;gap:10px;flex-wrap:wrap}
button,.pick,select{
background:#122b48;color:white;border:1px solid #00bde9;
padding:12px 15px;border-radius:10px;cursor:pointer
}
input[type=file]{display:none}
button:hover,.pick:hover{background:#07516a}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}
.photo{background:#0b1427;border:1px solid #263d62;border-radius:13px;overflow:hidden}
.photo img{width:100%;height:160px;object-fit:cover;cursor:pointer}
.info{padding:10px}
.info p{font-size:13px;color:#9eb5d3;overflow-wrap:anywhere}
.actions{display:flex;gap:6px;margin-top:8px}
.actions button{flex:1;padding:8px;font-size:12px}
.empty{text-align:center;color:#91a7c7;padding:35px}
#viewer{display:none;position:fixed;inset:0;background:#000e;z-index:10;align-items:center;justify-content:center;padding:15px}
#viewer img{max-width:95%;max-height:85%;object-fit:contain}
#viewer button{position:absolute;right:15px;top:15px}
footer{text-align:center;color:#627b9e;padding:25px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>LUAN ALBUM VIP</h1>
<p>MY PRIVATE PHOTO STORAGE • VIP PRO MAX</p>
</header>

<main>
<section class="panel">
<h3>📸 QUẢN LÝ HÌNH ẢNH</h3>
<br>
<div class="controls">
<label class="pick" for="upload">＋ THÊM ẢNH</label>
<input id="upload" type="file" accept="image/*" multiple>
<select id="category">
<option>Ảnh cá nhân</option>
<option>Xe Civic</option>
<option>Du lịch</option>
<option>Khác</option>
</select>
<button onclick="exportAll()">TẢI TẤT CẢ</button>
</div>
<br>
<p style="color:#8da9cb;font-size:12px">
Ảnh được lưu trong trình duyệt trên thiết bị này.
</p>
</section>

<section class="panel">
<div class="controls" style="justify-content:space-between">
<h3>🖼️ THƯ VIỆN ẢNH</h3>
<select id="filter" onchange="render()">
<option value="">Tất cả ảnh</option>
<option>Ảnh cá nhân</option>
<option>Xe Civic</option>
<option>Du lịch</option>
<option>Khác</option>
</select>
</div>
<br>
<div id="grid"><div class="empty">Đang tải thư viện...</div></div>
</section>
</main>

<div id="viewer" onclick="closeViewer()">
<button>ĐÓNG ✕</button>
<img id="big">
</div>

<footer>© 2026 LUAN ALBUM VIP • ALL RIGHTS RESERVED</footer>

<script>
const DB='LUAN_ALBUM_DATABASE';
let database;

const request=indexedDB.open(DB,1);

request.onupgradeneeded=()=>{
let db=request.result;
db.createObjectStore('photos',{keyPath:'id',autoIncrement:true});
};

request.onsuccess=()=>{
database=request.result;
render();
};

function store(mode='readonly'){
return database.transaction('photos',mode).objectStore('photos');
}

function getAll(){
return new Promise(resolve=>{
let r=store().getAll();
r.onsuccess=()=>resolve(r.result);
});
}

document.getElementById('upload').onchange=async e=>{
for(const file of e.target.files){
if(!file.type.startsWith('image/'))continue;
await new Promise(resolve=>{
let r=store('readwrite').add({
name:file.name,
category:document.getElementById('category').value,
blob:file,
date:Date.now()
});
r.onsuccess=resolve;
});
}
e.target.value='';
render();
};

async function render(){
if(!database)return;
let photos=await getAll();
let filter=document.getElementById('filter').value;
photos=photos.filter(p=>!filter||p.category===filter);

let grid=document.getElementById('grid');
grid.innerHTML='';

if(!photos.length){
grid.innerHTML='<div class="empty">Chưa có hình ảnh nào 📷</div>';
return;
}

photos.reverse().forEach(p=>{
let url=URL.createObjectURL(p.blob);
let card=document.createElement('div');
card.className='photo';

let img=document.createElement('img');
img.src=url;
img.onclick=()=>showImage(url);

let info=document.createElement('div');
info.className='info';

let name=document.createElement('p');
name.textContent=p.name;

let cat=document.createElement('p');
cat.textContent='📁 '+p.category;

let actions=document.createElement('div');
actions.className='actions';

let download=document.createElement('button');
download.textContent='TẢI';
download.onclick=()=>downloadPhoto(p);

let del=document.createElement('button');
del.textContent='XÓA';
del.onclick=async()=>{
if(confirm('Bạn muốn xóa ảnh này?')){
await new Promise(resolve=>{
let r=store('readwrite').delete(p.id);
r.onsuccess=resolve;
});
render();
}
};

actions.append(download,del);
info.append(name,cat,actions);
card.append(img,info);
grid.append(card);
});
}

function downloadPhoto(p){
let url=URL.createObjectURL(p.blob);
let a=document.createElement('a');
a.href=url;
a.download=p.name;
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function exportAll(){
let photos=await getAll();
if(!photos.length)return alert('Chưa có ảnh!');
photos.forEach((p,i)=>setTimeout(()=>downloadPhoto(p),i*300));
}

function showImage(url){
document.getElementById('big').src=url;
document.getElementById('viewer').style.display='flex';
}

function closeViewer(){
document.getElementById('viewer').style.display='none';
}
</script>
</body>
</html>
